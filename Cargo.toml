[package]
name = "plexus-transport"
version = "0.2.3"
edition = "2021"
license = "AGPL-3.0-only"
description = "Transport implementations for Plexus RPC: WebSocket, HTTP/SSE"

[dependencies]
# Core dependencies
plexus-core = "0.5"
tokio = { version = "1.42", features = ["full"] }
futures = "0.3"
async-stream = "0.3"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"

# JSON-RPC and WebSocket
jsonrpsee = { version = "0.26", features = ["server"] }
hyper = { version = "1", features = ["full"], optional = true }
bytes = "1"
http-body = "1"

# MCP protocol (feature "mcp", default-on)
rmcp = { version = "0.12", features = ["server", "transport-streamable-http-server"], optional = true }

# HTTP server
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http = "1.0"  # For extracting HTTP request parts from RequestContext
form_urlencoded = "1.2"  # For parsing query parameters

# Optional SQLite session storage (feature-gated)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"], optional = true }
tokio-stream = { version = "0.1", optional = true }

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
async-stream = "0.3"
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4"] }
tower = "0.5"
# plexus-macros aliased as "schemars" (schemars-compat feature) so that
# #[derive(schemars::JsonSchema)] in tests resolves to the no-op derive, preventing
# duplicate impl JsonSchema conflicts with PlexusRequest's generated impl.
# (Replaces the unpublished plexus-schemars-compat path dependency; real schemars
# types are reachable via plexus_core::__schemars. Cargo forbids depending on the
# same crate version under two names, so tests import PlexusRequest through the
# alias too: `use schemars::PlexusRequest;`.)
schemars = { version = "0.5.5", package = "plexus-macros", features = ["schemars-compat"] }
plexus-core = "0.5"

[features]
default = ["mcp"]
# MCP transport (rmcp-based). Default-on so existing 0.2.x consumers keep
# compiling unchanged; disable default features for REST/WebSocket-only builds
# that must not pull in the rmcp stack.
mcp = ["dep:rmcp"]
mcp-gateway = ["mcp", "hyper"]
http-gateway = ["hyper"]
sqlite-sessions = ["mcp", "sqlx", "tokio-stream"]
