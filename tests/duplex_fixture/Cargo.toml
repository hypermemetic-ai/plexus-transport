# BIDIR-6: an activation with an `Input`, for tests/duplex_wire.rs. A crate of
# its own because this repository's dev-dependencies alias `schemars` to
# plexus-macros, and the macro's expansion names the real one.
[package]
name = "duplex-fixture"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
plexus-core = { path = "../../../plexus-core", version = "0.11.0" }
plexus-macros = { path = "../../../plexus-macros", version = "0.11.0" }
plexus-client = { path = "../../../plexus-macros/plexus-client", version = "0.11.0", features = ["ws-native"] }
async-stream = "0.3"
bytes = "1"
async-trait = "0.1"
futures = "0.3"
jsonrpsee = { version = "0.26", features = ["server", "macros"] }
schemars = { version = "1.1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
