# LMLS-2: the native adapter fixture. An independent consumer of the wire
# crate's public API: it builds the v1 vectors with its own byte-level encoder,
# reads the committed vector file, and reports what the native decoder
# observes. Never published.
[package]
name = "mls-wire-native-fixture"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "mls-wire-native"
path = "src/main.rs"

[dependencies]
plexus-transport-mls = { path = "../.." }
serde_json = "1"
# The vectors' signatures are real ES256 signatures by a published test key,
# so a credential verifier has known answers. Deterministic (RFC 6979).
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
sha2 = "0.10"
