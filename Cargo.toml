[package]
name = "plexus-transport"
version = "0.10.0"
edition = "2021"
license = "MIT"
description = "Transport implementations for Plexus RPC: WebSocket, HTTP/SSE"
repository = "https://github.com/hypermemetic-ai/plexus-transport"
# DIST-2: the published crate is the library — not the plans, design notes,
# spikes or hooks that live beside it in the repository.
include = ["src/**", "README.md", "LICENSE", "Cargo.toml"]

[dependencies]
# Core dependencies
plexus-core = { path = "../plexus-core", version = "0.11.0" }
tokio = { version = "1.53", features = ["full"] }
futures = "0.3"
async-stream = "0.3"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
# DYNAUTH-8: the stdio transport hides jsonrpsee-core's whole-request traces
# behind a forwarding subscriber (`span::Current`, which tracing does not re-export).
tracing-core = "0.1"

# JSON-RPC and WebSocket
# server-core: jsonrpsee-core's method table (RpcModule, Methods), which
# plexus-core, the macro's server half and every service register into, and
# which PERF-20's loop drives — jsonrpsee-server is not in it.
# ws-client: Z2H-6 boot-time registry self-registration (src/registry.rs)
jsonrpsee = { version = "0.26", features = ["server-core", "ws-client"] }
# PERF-20: the socket's framing (RFC 6455) is tokio-tungstenite's, at the
# version plexus-client brings in; the loop over it is ours (src/ws/).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# AUTH-11: the WebSocket accept loop is hand-rolled (per-connection stop
# handles and peer addresses), so hyper is always in; PERF-20: its HTTP/1.1
# server, with a header timeout (RPC-4), answers the upgrade.
hyper = { version = "1.11", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
http-body = "1"
# ACCESS-62: the framing's `log` records are capped at debug (src/ws/mod.rs).
log = "0.4"

# MCP protocol (feature "mcp", default-OFF as of 0.5.0). TRANSPORT-23: the
# version plexus-transport-mcp is on, so an mcp build compiles one rmcp stack;
# scripts/check-rmcp.sh fails if a second version appears.
rmcp = { version = "3.8", default-features = false, features = ["server", "transport-streamable-http-server"], optional = true }
# TRANSPORT-16: the bridge as a client of the RPC, mounted in-process over
# HubTransport (`TransportServerBuilder::with_mcp`).
plexus-transport-mcp = { path = "../plexus-transport-mcp", version = "0.5", default-features = false, optional = true }

# HTTP server
axum = "0.8.9"
tower = { version = "0.5.3", features = ["util"] }
http = "1.5"  # For extracting HTTP request parts from RequestContext
form_urlencoded = "1.2"  # For parsing query parameters

# Optional SQLite session storage (feature-gated)
# sqlx 0.9 split the old "runtime-tokio-rustls" feature; sqlite needs no TLS.
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"], optional = true }
tokio-stream = { version = "0.1", optional = true }

# TRANSPORT-7: the trusted proxies' networks (CIDRs).
ipnet = "2"

# TRANSPORT-26: TLS served by the transport itself (feature `tls`): rustls
# on the ring provider, the rustls 0.23 / tokio-rustls 0.26 / ring that
# jsonrpsee's ws-client already brings into every build, so the feature
# compiles nothing new.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# RETURNS-36: the conformance fixture's service, served for `tests/synapse_reads.rs`
conformance = { path = "../plexus-macros/fixtures/conformance" }
# BIDIR-8: the duplex gate's test builds a gate in plexus-auth-core's terms.
plexus-auth-core = { path = "../plexus-auth-core" }
# TRANSPORT-23: no rmcp here. `cargo tree` walks dev edges and a dev-dependency
# cannot be optional, so one here would show in every non-mcp tree. The tests'
# MCP client is the `__mcp-test-client` feature below.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
async-stream = "0.3"
async-trait = "0.1"
uuid = { version = "1.6", features = ["v4"] }
tower = "0.5"
# AUTHZ-BEARER-1 integration tests: empty HTTP body + BodyExt::collect.
http-body-util = "0.1"
# PERF-20: the socket-edge tests' client (frames written by hand when a test
# needs what a well-behaved client never sends), and ACCESS-62's trace
# capture (fmt, with the `log` bridge, so the WebSocket library's own
# records are caught too).
tokio-tungstenite = "0.30"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
# plexus-macros aliased as "schemars" (schemars-compat feature) so that
# #[derive(schemars::JsonSchema)] in tests resolves to the no-op derive,
# preventing duplicate impl JsonSchema conflicts with PlexusRequest's
# generated impl. (Replaces the retired plexus-schemars-compat crate; real
# schemars types are reachable via plexus_core::__schemars. Cargo forbids
# depending on the same crate under two names, so tests import PlexusRequest
# through the alias too: `use schemars::PlexusRequest;`.)
schemars = { path = "../plexus-macros", package = "plexus-macros", features = ["schemars-compat"] }
plexus-core = { path = "../plexus-core", version = "0.11.0" }
# BIDIR-6: tests/duplex_wire.rs's activation; a crate of its own, see its manifest.
duplex-fixture = { path = "tests/duplex_fixture" }
# RETURNS-47: activations that read their caller, for tests/returns47_bridges.rs.
returns47-fixture = { path = "tests/returns47_fixture" }
# TRANSPORT-26: a test CA and its certificates, made in each test.
rcgen = "0.14"

# TRANSPORT-17: each is its own child, `serve_stdio` on its own stdout, so
# libtest's lines stay off that stdout.
# TRANSPORT-26: the listeners over TLS.
[[test]]
name = "tls"
required-features = ["tls"]

# TRANSPORT-26's perf row: plain against TLS on the socket (ignored; run in
# release with --ignored --nocapture).
[[test]]
name = "tls_cost"
required-features = ["tls"]

[[test]]
name = "stdio_pipes"
harness = false

[[test]]
name = "stdio_kit"
harness = false

[features]
default = []
# MCP transport (rmcp-based). Default-OFF as of 0.5.0: REST/WebSocket-only
# consumers no longer pull in the rmcp stack. Enable with `--features mcp`.
mcp = ["dep:rmcp", "dep:plexus-transport-mcp"]
# Test support, not API: rmcp's client, for the tests that drive the bridges
# with a real MCP client. On under --all-features.
__mcp-test-client = ["mcp", "rmcp/client", "rmcp/transport-streamable-http-client-reqwest", "rmcp/reqwest"]
mcp-gateway = ["mcp"]
http-gateway = []
# TRANSPORT-26: every listener serves TLS when given a certificate
# (`TransportServerBuilder::with_tls`). Default-OFF; without it nothing
# changes and `with_tls` is not there.
tls = ["dep:tokio-rustls"]
sqlite-sessions = ["mcp", "sqlx", "tokio-stream"]

# PERF-6 (PLEXUS/PERF-6): the one build perf runs and releases use, PERF-1's
# `profiles` fork built to its recommendation. Release, with LTO across every
# crate and one codegen unit, and line tables kept for flamegraphs; `panic` is
# release's (menger's tests rely on unwinding). Dev, test and release are
# unchanged. `cargo build --profile perf`; plexus-bench measures with it.
[profile.perf]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
